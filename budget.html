<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구단 계좌 계산기</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e5e7eb;--text:#17191d;--muted:#6b7280;--plus:#147a48;--minus:#c43b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:24px auto 50px}.hero{background:#17191d;color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:16px}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#cbd0d8;font-size:13px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}.stack{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.05)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 19px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:17px}.body{padding:17px 19px}.start{display:grid;grid-template-columns:1fr 190px;gap:12px;align-items:center}.start small,.note{color:var(--muted);font-size:12px}.money{position:relative}.money input{width:100%;height:45px;border:1px solid var(--line);border-radius:11px;padding:0 48px 0 12px;text-align:right;font-weight:800;outline:none}.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f1f3}.row:last-child{border-bottom:0}.label{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750}.badge{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;font-weight:900}.badge.plus{background:#eaf7ef;color:var(--plus)}.badge.minus{background:#fff0f0;color:var(--minus)}.lux{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lux label,.field label{display:block;margin:0 0 4px 2px;font-size:11px;color:var(--muted)}button{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.dark{background:#1f2937;color:#fff}.light{background:#eef2f7;color:#273244}.danger{background:#fff0f0;color:var(--minus)}.actions{display:flex;gap:7px;flex-wrap:wrap}.extras{display:grid;gap:11px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px;border:1px dashed #d6dae0;border-radius:12px}.extra{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fafbfc}.extraTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:850}.extraGrid{display:grid;grid-template-columns:1.2fr .7fr .7fr;gap:8px}.extraGrid.pen{grid-template-columns:1.3fr .7fr}.field.full{grid-column:1/-1}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 9px;background:#fff}.result{position:sticky;top:16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}.sum{background:#f7f8fa;border:1px solid #eceef1;border-radius:13px;padding:13px}.sum span{display:block;color:var(--muted);font-size:11px}.sum strong{font-size:21px}.positive{color:var(--plus)}.negative{color:var(--minus)}.opts{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:12px}.report{border:1px solid var(--line);border-radius:13px;overflow:hidden}.rStart,.rTotal{padding:13px 14px;background:#f5f6f8;font-weight:900}.rTotal{background:#17191d;color:#fff}.rRow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 13px;border-top:1px solid #f0f1f3;font-size:13px}.chip{background:#f2f4f7;color:#596273;padding:4px 7px;border-radius:999px;font-size:10px;white-space:nowrap}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:#17191d;color:#fff;padding:9px 13px;border-radius:999px;font-size:13px;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.grid{grid-template-columns:1fr}.result{position:static}}@media(max-width:600px){.wrap{width:calc(100% - 14px);margin-top:8px}.hero,.card{border-radius:14px}.row,.start{grid-template-columns:1fr}.extraGrid,.extraGrid.pen{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.rRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap"><section class="hero"><h1>구단 계좌 계산기 ⚾</h1><p>시즌 예산과 트레이드·징계 내역을 순서대로 반영합니다.</p></section><div class="grid"><div class="stack"><section class="card"><div class="head"><h2>현재 구단 계좌</h2></div><div class="body"><div class="start"><div><b>시즌 시작 전 보유액</b><br><small>모든 수입·지출은 이 금액을 기준으로 계산됩니다.</small></div><div class="money"><input id="start" type="number" step="0.1" value="0"><span>억원</span></div></div></div></section><section class="card"><div class="head"><h2>고정 시즌 항목</h2></div><div class="body" id="fixed"></div></section><section class="card"><div class="head"><h2>트레이드 · 징계</h2><div class="actions"><button class="dark" id="trade">+ 트레이드</button><button class="danger" id="penalty">+ 징계</button></div></div><div class="body"><div id="extras" class="extras"></div></div></section></div><section class="card result"><div class="head"><h2>계산 결과</h2><div class="actions"><button class="dark" id="copy">텍스트 복사</button><button class="light" id="reset">초기화</button></div></div><div class="body"><div class="summary"><div class="sum"><span>최종 구단 계좌</span><strong id="final">0억원</strong></div><div class="sum"><span>시즌 총 변동</span><strong id="change">0억원</strong></div></div><div class="opts"><label><input id="hide" type="checkbox"> 0억원 숨기기</label><label><input id="running" type="checkbox" checked> 항목별 잔액 표시</label></div><div id="report" class="report"></div><p class="note">입력값은 각 사용자의 브라우저에 자동 저장됩니다. 단위는 모두 억원입니다.</p></div></section></div></main><div id="toast" class="toast"></div>
<script>
const K='vbl-budget-v3';
const stages=[['spring','스프링캠프지',-1],['foreignSign','용병 계약금',-1],['foreignSalary','용병 연봉',-1],['foreignExtra','용병 추가권',-1],['asian','아시안쿼터 연봉',-1],['league','리그 보상금',1],['luxury','사치세',-1,'lux'],['playerOpt','선수 성적 옵션',-1],['teamOpt','팀 성적 옵션',-1],['awardOpt','시상식 옵션',-1],['faExtra','FA 추가 영입권',-1],['faSign','FA 계약금',-1],['faIn','FA 보상지명금 수입',1],['faOut','FA 보상지명금 지출',-1],['rookie','신인계약금',-1]];
const num=v=>Number.isFinite(+v)?+v:0;
const fmt=v=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:3}).format(Math.round((num(v)+Number.EPSILON)*1000)/1000);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const blank=()=>Object.fromEntries(stages.map(s=>[s[0],s[3]?{salary:0,tax:0}:0]));
let state={start:0,fixed:blank(),extras:[],hide:false,running:true};
try{const saved=JSON.parse(localStorage.getItem(K)||'{}');state={...state,...saved,fixed:{...blank(),...(saved.fixed||{})}}}catch{}
const $=id=>document.getElementById(id),fixed=$('fixed'),extras=$('extras');
function save(){localStorage.setItem(K,JSON.stringify(state))}
function renderFixed(){fixed.innerHTML=stages.map(([id,label,sign,special])=>{const b=sign>0?'+':'−',c=sign>0?'plus':'minus';if(special){const v=state.fixed[id]||{};return `<div class="row"><div class="label"><span class="badge ${c}">${b}</span>${label}</div><div class="lux"><div><label>연봉</label><div class="money"><input data-id="${id}" data-sub="salary" type="number" step="0.1" value="${num(v.salary)}"><span>억</span></div></div><div><label>사치세</label><div class="money"><input data-id="${id}" data-sub="tax" type="number" step="0.1" value="${num(v.tax)}"><span>억</span></div></div></div></div>`}return `<div class="row"><div class="label"><span class="badge ${c}">${b}</span>${label}</div><div class="money"><input data-id="${id}" type="number" step="0.1" value="${num(state.fixed[id])}"><span>억원</span></div></div>`}).join('')}
function options(sel){return [`<option value="start" ${sel==='start'?'selected':''}>시즌 시작 직후</option>`,...stages.map(s=>`<option value="${s[0]}" ${sel===s[0]?'selected':''}>${s[1]} 다음</option>`)].join('')}
function renderExtras(){if(!state.extras.length){extras.innerHTML='<div class="empty">아직 추가된 내역이 없습니다.</div>';return}extras.innerHTML=state.extras.map(x=>{const t=x.type==='trade';return `<div class="extra" data-x="${x.id}"><div class="extraTop"><span>${t?'↕ 트레이드':'− 징계'}</span><button class="danger" data-del="${x.id}">삭제</button></div><div class="extraGrid ${t?'':'pen'}"><div class="field"><label>내용</label><input data-f="desc" value="${esc(x.desc)}" placeholder="${t?'예: 현금 트레이드':'예: 규정 위반 벌금'}"></div>${t?`<div class="field"><label>수입 / 지출</label><select data-f="dir"><option value="1" ${num(x.dir)===1?'selected':''}>+ 수입</option><option value="-1" ${num(x.dir)===-1?'selected':''}>- 지출</option></select></div>`:''}<div class="field"><label>금액(억원)</label><input data-f="amount" type="number" step="0.1" value="${num(x.amount)}"></div><div class="field full"><label>반영 시점</label><select data-f="after">${options(x.after||'start')}</select></div></div></div>`}).join('')}
function events(){const by={};state.extras.forEach(x=>(by[x.after||'start']??=[]).push({label:x.type==='trade'?'트레이드':'징계',desc:x.desc||'',delta:Math.abs(num(x.amount))*(x.type==='penalty'?-1:(num(x.dir)===-1?-1:1))}));const out=[...(by.start||[])];stages.forEach(([id,label,sign,special])=>{if(special){const v=state.fixed[id]||{};out.push({label,delta:-(num(v.salary)+num(v.tax)),salary:num(v.salary),tax:num(v.tax),lux:true})}else out.push({label,delta:Math.abs(num(state.fixed[id]))*sign});out.push(...(by[id]||[]))});return out}
function line(e,html){if(e.lux)return html?`${e.label}: <b class="negative">- (연봉 ${fmt(e.salary)}억원 + 사치세 ${fmt(e.tax)}억원) = - ${fmt(Math.abs(e.delta))}억원</b>`:`${e.label}: - (연봉 ${fmt(e.salary)}억원 + 사치세 ${fmt(e.tax)}억원) = - ${fmt(Math.abs(e.delta))}억원`;const d=e.desc?` (${e.desc})`:'';const s=e.delta>0?'+':e.delta<0?'-':'';return html?`${esc(e.label)}${esc(d)}: <b class="${e.delta>0?'positive':e.delta<0?'negative':''}">${s} ${fmt(Math.abs(e.delta))}억원</b>`:`${e.label}${d}: ${s} ${fmt(Math.abs(e.delta))}억원`}
function calc(){let bal=num(state.start),rows=[],txt=[`현재 구단 계좌: ${fmt(bal)}억원`,''];for(const e of events()){bal+=e.delta;if(!(state.hide&&Math.abs(e.delta)<1e-9)){rows.push(`<div class="rRow"><div>${line(e,true)}</div>${state.running?`<span class="chip">잔액 ${fmt(bal)}억원</span>`:''}</div>`);txt.push(line(e,false))}}const ch=bal-num(state.start);$('report').innerHTML=`<div class="rStart">현재 구단 계좌: ${fmt(state.start)}억원</div>${rows.join('')}<div class="rTotal">합계: ${fmt(bal)}억원<br><small>총 변동 ${ch>0?'+':''}${fmt(ch)}억원</small></div>`;$('final').textContent=`${fmt(bal)}억원`;$('change').textContent=`${ch>0?'+':''}${fmt(ch)}억원`;$('final').className=bal>0?'positive':bal<0?'negative':'';$('change').className=ch>0?'positive':ch<0?'negative':'';txt.push('',`합계: ${fmt(bal)}억원`);return txt.join(String.fromCharCode(10))}
function sync(){save();calc()}
function add(type){state.extras.push({id:Date.now()+Math.random().toString(16).slice(2),type,desc:'',dir:type==='trade'?1:-1,amount:0,after:'start'});renderExtras();sync()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1300)}
$('start').value=state.start;$('hide').checked=state.hide;$('running').checked=state.running;renderFixed();renderExtras();calc();
$('start').oninput=e=>{state.start=num(e.target.value);sync()};
fixed.oninput=e=>{const id=e.target.dataset.id;if(!id)return;const sub=e.target.dataset.sub;if(sub)state.fixed[id]={...(state.fixed[id]||{}),[sub]:num(e.target.value)};else state.fixed[id]=num(e.target.value);sync()};
extras.oninput=extras.onchange=e=>{const box=e.target.closest('[data-x]'),f=e.target.dataset.f;if(!box||!f)return;const x=state.extras.find(v=>v.id===box.dataset.x);x[f]=(f==='amount'||f==='dir')?num(e.target.value):e.target.value;sync()};
extras.onclick=e=>{const id=e.target.dataset.del;if(!id)return;state.extras=state.extras.filter(x=>x.id!==id);renderExtras();sync()};
$('trade').onclick=()=>add('trade');$('penalty').onclick=()=>add('penalty');$('hide').onchange=e=>{state.hide=e.target.checked;sync()};$('running').onchange=e=>{state.running=e.target.checked;sync()};
$('copy').onclick=async()=>{const t=calc();try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('계산 결과를 복사했습니다.')};
$('reset').onclick=()=>{if(!confirm('입력값을 모두 초기화할까요?'))return;state={start:0,fixed:blank(),extras:[],hide:false,running:true};$('start').value=0;$('hide').checked=false;$('running').checked=true;renderFixed();renderExtras();sync();toast('초기화했습니다.')};
</script>
</body>
</html>
